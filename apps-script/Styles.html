<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #22301f;
    --forest: #2e5339;
    --deep: #233d2b;
    --gold: #c9a24b;
    --gold-soft: #f3ead2;
    --cream: #fbf9f4;
    --sage: #e9efe6;
    --sage-deep: #d5e0d0;
    --amber: #b97a2a;
    --red: #a84632;
    --grey: #7a8577;
    --shadow: 0 2px 12px rgba(34, 48, 31, .08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 18px 60px; }

  /* Header band */
  .band {
    background: var(--deep);
    color: var(--cream);
    padding: 26px 18px 22px;
    text-align: center;
    border-bottom: 3px solid var(--gold);
  }
  .band .org {
    font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--gold); font-weight: 600; margin-bottom: 6px;
  }
  .band h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 650; font-size: 28px; letter-spacing: .01em;
  }
  .band .sub { font-size: 13px; color: #cfdac9; margin-top: 5px; }

  /* Sections & cards */
  .step { margin-top: 26px; }
  .step-label {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Fraunces', Georgia, serif; font-size: 18px; font-weight: 650;
    color: var(--forest); margin-bottom: 12px;
  }
  .step-label .num {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--gold); color: var(--deep);
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center; flex: none;
  }
  .card {
    background: #fff; border: 1px solid var(--sage-deep);
    border-radius: 14px; box-shadow: var(--shadow); padding: 16px;
  }

  /* Chips */
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    border: 1.5px solid var(--sage-deep); background: #fff; color: var(--ink);
    border-radius: 999px; padding: 12px 18px;
    font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 500;
    min-height: 48px; cursor: pointer; transition: all .12s ease;
  }
  .chip:active { transform: scale(.97); }
  .chip.on {
    background: var(--forest); border-color: var(--forest);
    color: var(--cream); font-weight: 600;
    box-shadow: 0 2px 8px rgba(46, 83, 57, .35);
  }
  .chip.gold.on { background: var(--gold); border-color: var(--gold); color: var(--deep); }

  .cat-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--grey); margin: 18px 0 10px;
  }
  .cat-title:first-child { margin-top: 2px; }
  .cat-title .rule { flex: 1; height: 1px; background: var(--sage-deep); }

  /* Buttons */
  .btn {
    display: block; width: 100%; border: none; border-radius: 14px;
    min-height: 58px; padding: 16px;
    font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700;
    cursor: pointer; transition: all .15s ease;
  }
  .btn-primary { background: var(--forest); color: var(--cream); box-shadow: 0 4px 14px rgba(46,83,57,.35); }
  .btn-primary:disabled { background: var(--sage-deep); color: var(--grey); box-shadow: none; cursor: default; }
  .btn-gold { background: var(--gold); color: var(--deep); box-shadow: 0 4px 14px rgba(201,162,75,.4); }
  .btn:active:not(:disabled) { transform: scale(.98); }

  /* Welcome-back banner */
  .hello {
    background: var(--gold-soft); border: 1px solid var(--gold);
    border-radius: 12px; padding: 12px 16px; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 15px;
  }
  .hello b { color: var(--deep); }
  .hello a { color: var(--amber); font-size: 13px; font-weight: 600; text-decoration: underline; cursor: pointer; white-space: nowrap; }

  /* Success screen */
  .success { text-align: center; padding: 60px 10px 20px; }
  .success .big { font-size: 74px; line-height: 1; }
  .success h2 { font-family: 'Fraunces', Georgia, serif; font-size: 28px; color: var(--forest); margin: 18px 0 8px; }
  .success p { color: var(--grey); font-size: 15px; }
  .success .pill {
    display: inline-block; margin-top: 14px; background: var(--sage);
    border-radius: 999px; padding: 8px 18px; font-weight: 600; color: var(--forest); font-size: 15px;
  }

  textarea {
    width: 100%; border: 1.5px solid var(--sage-deep); border-radius: 12px;
    padding: 12px 14px; font-family: 'Inter', sans-serif; font-size: 16px;
    min-height: 96px; resize: vertical; background: #fff; color: var(--ink);
  }
  textarea:focus { outline: none; border-color: var(--forest); }

  /* Class accordion (check-out picker) */
  .animal-search {
    width: 100%; border: 1.5px solid var(--sage-deep); border-radius: 12px;
    padding: 13px 16px; font-family: 'Inter', sans-serif; font-size: 16px;
    margin-bottom: 12px; background: #fff; color: var(--ink);
  }
  .animal-search:focus { outline: none; border-color: var(--forest); }
  .acc { border: 1px solid var(--sage-deep); border-radius: 12px; margin-bottom: 10px;
         overflow: hidden; background: #fff; }
  .acc-head {
    display: flex; align-items: center; gap: 10px; width: 100%;
    border: none; background: #fff; padding: 14px 16px; text-align: left;
    font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 600;
    color: var(--ink); cursor: pointer; min-height: 54px;
  }
  .acc-head .count { margin-left: auto; background: var(--sage); color: var(--forest);
    border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 700; }
  .acc-head .chev { color: var(--grey); transition: transform .15s ease; font-size: 13px; }
  .acc.open .chev { transform: rotate(180deg); }
  .acc-body { display: none; padding: 2px 14px 14px; border-top: 1px dashed var(--sage-deep); }
  .acc.open .acc-body { display: block; }

  .acc-head .count.picked-count { background: var(--gold); color: var(--deep); }
  .acc-head .count.dim { background: transparent; color: var(--grey); padding: 3px 4px; }

  /* Multi-select chips show a tick; the "picked" strip lists the selection */
  .chips.multi .chip.on::before { content: '✓ '; font-weight: 700; }
  .hint { font-size: 13.5px; color: var(--grey); margin: -6px 0 10px; }
  .picked { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .picked:empty { display: none; }
  .picked.center { justify-content: center; margin: 14px 0 4px; }
  .picked span {
    background: var(--gold-soft); border: 1px solid var(--gold); color: var(--deep);
    border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600;
  }

  .note { font-size: 13px; color: var(--grey); margin-top: 10px; text-align: center; }
  .error {
    background: #f7e5df; border: 1px solid var(--red); color: var(--red);
    border-radius: 12px; padding: 12px 16px; margin-top: 14px; font-size: 14px; font-weight: 500;
    display: none;
  }
  .spinner {
    width: 26px; height: 26px; margin: 0 auto;
    border: 3px solid var(--sage-deep); border-top-color: var(--forest);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
