<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  /* QR posters — "Sticker Sheet" identity (11-27). Prints cleanly; system fonts only. */
  :root { --f: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", "Varela Round", system-ui, -apple-system, "Segoe UI", sans-serif;
          --b: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: radial-gradient(rgba(107,63,160,.10) 2px, transparent 2.5px) 0 0/26px 26px, #fbf6ec; color: #2a1f3d; font-family: var(--b); padding: 30px 20px; }
  .toolbar { max-width: 900px; margin: 0 auto 26px; display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
  .toolbar h1 { font: 900 26px/1.15 var(--f); letter-spacing: -.02em; color: #2a1f3d; }
  .toolbar button {
    background: #6b3fa0; color: #fff; border: 4px solid #fff; border-radius: 999px;
    padding: 11px 24px; font: 900 16px var(--f); cursor: pointer;
    box-shadow: 0 2px 0 rgba(42,31,61,.10), 0 10px 22px -10px rgba(42,31,61,.35);
  }
  .posters { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  .poster {
    position: relative; border-radius: 34px; padding: 44px 34px; text-align: center;
    border: 8px solid #fff; outline: 2px solid #e6dcef;
    box-shadow: 0 2px 0 rgba(42,31,61,.10), 0 16px 34px -14px rgba(42,31,61,.40);
    page-break-inside: avoid;
  }
  .poster.out { background: #6b3fa0; color: #fff; transform: rotate(-1deg); }
  .poster.back { background: #e6f4d7; color: #2a1f3d; transform: rotate(1deg); }
  .poster .tag {
    display: inline-block; font: 800 12.5px var(--f); letter-spacing: .14em; text-transform: uppercase;
    border-radius: 999px; padding: 4px 12px;
  }
  .poster.out .tag { background: #79b83a; color: #14200a; }
  .poster.back .tag { background: #6b3fa0; color: #fff; }
  .poster h2 { font: 900 42px/1.05 var(--f); letter-spacing: -.03em; margin: 12px 0 6px; }
  .poster .emoji {
    font-size: 54px; display: inline-grid; place-items: center; width: 100px; height: 100px; margin: 0 0 12px;
    background: #fff; border-radius: 50%; border: 5px solid #fff; box-shadow: 0 8px 18px -8px rgba(42,31,61,.45); transform: rotate(-6deg);
  }
  .poster p { font-size: 17px; opacity: .9; margin-bottom: 24px; }
  .qr { background: #fff; display: inline-block; padding: 18px; border-radius: 22px; border: 3px dashed rgba(42,31,61,.18); }
  .qr img, .qr canvas { display: block; }
  .poster .hint { margin-top: 22px; font: 700 14.5px var(--f); opacity: .85; }
  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .posters { display: block; }
    .poster { border-radius: 0; box-shadow: none; outline: 0; border: 0; margin: 0; min-height: 96vh; transform: none;
              display: flex; flex-direction: column; justify-content: center; align-items: center;
              -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  @media (max-width: 760px) { .posters { grid-template-columns: 1fr; } .poster h2 { font-size: 34px; } }
</style>

<div class="toolbar">
  <h1>QR Posters — print, laminate, mount 🐾</h1>
  <button onclick="window.print()">🖨️ Print</button>
</div>

<div class="posters">
  <div class="poster out">
    <div class="emoji">🐕‍🦺</div>
    <div class="tag"><?= orgName ?></div>
    <h2>Taking a friend out?</h2>
    <p>Scan to check an animal out of its enclosure</p>
    <div class="qr" id="qrOut"></div>
    <div class="hint">Point your camera here · takes 10 seconds</div>
  </div>

  <div class="poster back">
    <div class="emoji">🏡</div>
    <div class="tag"><?= orgName ?></div>
    <h2>I'm back!</h2>
    <p>Scan to tuck your friend back in &amp; share how it went</p>
    <div class="qr" id="qrIn"></div>
    <div class="hint">Point your camera here · takes 30 seconds</div>
  </div>
</div>

<script>
  var base = '<?= appUrl ?>';
  new QRCode(document.getElementById('qrOut'), {
    text: base + '?page=out', width: 220, height: 220,
    colorDark: '#233d2b', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.L,
  });
  new QRCode(document.getElementById('qrIn'), {
    text: base + '?page=in', width: 220, height: 220,
    colorDark: '#233d2b', colorLight: '#ffffff',
    correctLevel: QRCode.CorrectLevel.L,
  });
</script>
